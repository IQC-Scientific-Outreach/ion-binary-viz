<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Content-Security-Policy: everything this page needs (script, style,
  the logo image, and the csv/ fetch fallback for hosted use) is
  same-origin -- no CDNs, no inline scripts, no third parties -- so
  script-src can stay locked to 'self' with no exceptions. style-src
  needs 'unsafe-inline' because the page's CSS lives in the <style>
  block below and in a couple of inline style="" attributes; that's a
  much smaller risk than allowing inline *script* (CSS can't run
  arbitrary JS in modern browsers). GitHub Pages doesn't support
  setting this as a real HTTP header on a static site, so it's declared
  here instead -- note that a couple of directives (frame-ancestors in
  particular, which would block this page from being embedded in an
  iframe elsewhere) are only honored when sent as a header and are
  silently ignored in a <meta> tag; there's no way around that on plain
  GitHub Pages short of fronting it with something like Cloudflare.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Text &rarr; Ion Detector Visualizer</title>
<style>
  /* ===================================================================
     LAYOUT / THEME
     Mirrors the desktop (tkinter) version: a big detector image on top,
     a row of 0/1 bit labels under it, a "phrase so far" line, then the
     controls, then a status line.

     This used to live in a separate style.css, but it's inlined here
     instead so the page can never end up unstyled because that file
     didn't get uploaded or its path didn't resolve -- there's now only
     one thing (index.html) that has to be in the right place.
     =================================================================== */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #ddd;
    font-family: Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* --- Top area: the main ion image+bits column, plus the optional
     Tracking history panel to its right. #visualRow takes the place
     #detectorArea used to occupy directly under #app; #mainColumn
     bundles the image and its bit-label row together so they always
     shrink/stay centered as a unit, exactly as before, regardless of
     whether the tracking panel is taking up space next to them. --- */
  #visualRow {
    flex: 6 1 0;
    display: flex;
    flex-direction: row;
    min-height: 0;
  }
  #mainColumn {
    flex: 1 1 auto;   /* fills all available width when Tracking is off */
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  /* --- Detector image + placeholder-on-error overlay --- */
  #detectorArea {
    flex: 1 1 0;
    position: relative;
    min-height: 0;
    background: #000;
  }
  #ionCanvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;      /* keep it blocky, like imshow's nearest-neighbor */
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  #placeholderMsg {
    position: absolute;
    inset: 0;
    display: none;                   /* shown only if the ion CSVs fail to load */
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    font-size: 16px;
    white-space: pre-line;
    padding: 24px;
    box-sizing: border-box;
  }

  /* --- Tracking history panel: hidden (zero width) until turned on.
     No axis labels/ticks, same blocky pixelated rendering as the main
     image, just a bare canvas. A thin white line separates it from the
     main ion image when visible. --- */
  #trackingArea {
    flex: 0 0 0;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #000;
    box-sizing: border-box;
  }
  #app.tracking-on #trackingArea {
    flex: 0 0 24%;
    margin-left: 16px;
    padding-left: 12px;
    border-left: 1px solid #ffffff;
  }
  #trackingCanvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* --- Row of 8 evenly-spaced 0/1 bit labels --- */
  #bitsRow {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-evenly;
    padding: 6px 40px 0 40px;
  }
  .bitCell {
    flex: 1;
    text-align: center;
    font-family: "Courier New", monospace;
    font-weight: bold;
    font-size: clamp(16px, 2.4vw, 26px);
    color: #fff;
  }

  /* --- "Phrase so far" line --- */
  #phraseRow {
    flex: 0 0 auto;
    text-align: center;
    padding: 10px 20px;
    font-size: clamp(24px, 4vw, 40px);
    min-height: 1.3em;
    font-weight: bold;
  }
  #phraseRow .past { color: #808080; font-weight: normal; }
  #phraseRow .current { color: #fff; font-weight: bold; }

  /* --- Controls --- */
  #controlsArea {
    flex: 0 0 auto;
    background: #111;
    padding: 20px 40px 0 40px;
  }
  #entryInput {
    width: 100%;
    font-size: clamp(20px, 3vw, 36px);
    text-align: center;
    background: #1c1c1c;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 14px;
    box-sizing: border-box;
    margin-bottom: 20px;
  }
  #entryInput:focus { outline: 2px solid #444; }

  .controlsRow {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 20px;
  }
  .controlGroup {
    flex: 1 1 120px;
    min-width: 110px;
    max-width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .controlGroup label {
    color: #ccc;
    font-size: 13px;
    margin-bottom: 4px;
  }
  button.appBtn {
    flex: 1 1 110px;
    min-width: 100px;
    max-width: 220px;
    padding: 12px 10px;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }
  select.appSelect {
    width: 100%;
    padding: 6px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
  }
  input[type=range] { width: 100%; }

  /* --- Status line --- */
  #statusArea {
    text-align: center;
    color: #ddd;
    padding: 4px 0 16px 0;
    font-size: clamp(14px, 2vw, 18px);
    background: #111;
  }

  /* --- Credits footer: logo lower-left, attribution text lower-right --- */
  #creditsRow {
    flex: 0 0 auto;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 24px 10px 24px;
  }
  #creditsLogo {
    height: 24px;
    display: block;
  }
  #creditsText {
    text-align: right;
    font-size: 11px;
    line-height: 1.5;
    color: #888;
  }
  #creditsText a {
    color: #aaa;
    text-decoration: underline;
  }
  #creditsText a:hover {
    color: #fff;
  }
</style>
</head>
<body>
<div id="app">
  <div id="visualRow">
    <div id="mainColumn">
      <div id="detectorArea">
        <canvas id="ionCanvas"></canvas>
        <div id="placeholderMsg"></div>
      </div>
      <div id="bitsRow"></div>
    </div>
    <div id="trackingArea">
      <canvas id="trackingCanvas"></canvas>
    </div>
  </div>

  <div id="phraseRow"></div>

  <div id="controlsArea">
    <input id="entryInput" type="text" autocomplete="off" spellcheck="false">

    <div class="controlsRow">
      <button id="modeBtn" class="appBtn"></button>

      <div class="controlGroup">
        <label>Sound</label>
        <select id="soundSelect" class="appSelect"></select>
      </div>

      <div class="controlGroup">
        <label>Clarity</label>
        <input id="claritySlider" type="range" min="0.5" max="5" step="0.1" value="1">
      </div>

      <button id="noiseBtn" class="appBtn"></button>
      <button id="trackingBtn" class="appBtn"></button>
      <button id="muteBtn" class="appBtn">&#128266; Sound On</button>
      <button id="fullscreenBtn" class="appBtn" style="background:#333;">&#9974; Fullscreen</button>

      <div id="modeSpecificArea" style="display:flex; gap:12px; flex:2 1 260px; justify-content:center;"></div>
    </div>
  </div>

  <div id="statusArea"></div>

  <div id="creditsRow">
    <a href="https://uwaterloo.ca/institute-for-quantum-computing/" target="_blank" rel="noopener noreferrer">
      <img id="creditsLogo" src="logo.png" alt="University of Waterloo Institute for Quantum Computing">
    </a>
    <div id="creditsText">
      <div>Developed by the <a href="https://uwaterloo.ca/institute-for-quantum-computing/outreach" target="_blank" rel="noopener noreferrer">IQC Scientific Outreach</a> Team</div>
      <div>Data from the <a href="https://qiti.iqc.uwaterloo.ca/" target="_blank" rel="noopener noreferrer">Quantum Information with Trapped Ions</a> (QITI) lab</div>
    </div>
  </div>
</div>

<!--
  Optional: if ion_data.js exists (generate it once with convert.html),
  it defines window.ION_PEAK_DATA and script.js will use it directly --
  no fetch() involved, so this works when the page is opened straight
  from disk (file://) on Windows or a Raspberry Pi. If the file isn't
  present, the browser just skips this tag and script.js falls back to
  fetching the CSVs from the csv/ folder instead (for hosted use, e.g.
  GitHub Pages). Either way, nothing else about this page changes.
-->
<script src="ion_data.js"></script>
<script src="script.js"></script>
</body>
</html>
